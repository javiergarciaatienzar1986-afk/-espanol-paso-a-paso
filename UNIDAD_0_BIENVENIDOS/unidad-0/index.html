<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unidad 0 · Bienvenidos</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#23344d;background:#f2f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:18px}header{text-align:center}h1{font-size:clamp(26px,5vw,42px);margin:8px}p{line-height:1.5}.panel{background:white;border-radius:26px;padding:clamp(18px,4vw,36px);box-shadow:0 7px 24px #183b5a14;min-height:430px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;font-weight:800;color:#236c79}.progress{height:12px;border-radius:20px;background:#dceaf1;margin:14px 0 25px;overflow:hidden}.bar{height:100%;background:#28a8a0;transition:width .25s}h2{text-align:center;font-size:clamp(22px,4vw,32px)}.instruction{text-align:center;color:#47627d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:14px;margin:24px 0}.choice{min-height:145px;border:3px solid #d8e5ee;background:#fbfdff;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;font-size:20px;font-weight:800;color:#24364f}.choice .icon{font-size:clamp(48px,8vw,78px);line-height:1.1}.choice:focus-visible,button:focus-visible{outline:4px solid #f2b84b;outline-offset:2px}.choice:hover{border-color:#70b9c6}.choice.correct{border-color:#18a46d;background:#e5fff2}.choice.wrong{border-color:#e18d8d;background:#fff0ef}.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:24px}button.action{border:0;border-radius:17px;padding:15px 21px;font-size:19px;font-weight:800;cursor:pointer;background:#e1eff7;color:#24506c;min-height:54px}button.primary{background:#247c93;color:white}button:disabled{opacity:.38;cursor:not-allowed}.feedback{min-height:45px;text-align:center;font-size:22px;font-weight:800;color:#12684c}.hint{text-align:center;color:#52677e;font-size:14px}.big{font-size:clamp(70px,12vw,120px);text-align:center}.letter{font-size:clamp(55px,10vw,96px);font-weight:900;color:#167f93}.row{text-align:center}.tag{display:inline-block;background:#e6f5f7;border-radius:15px;padding:8px 16px;font-weight:800}.end{text-align:center;font-size:23px}.muted{font-size:14px;color:#52677e;text-align:center;margin-top:18px}@media(max-width:500px){.choice{min-height:125px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.choice .icon{font-size:56px}}
</style></head><body><main><header><div style="font-size:40px">👋 🌍 🔤</div><h1>Unidad 0 · Bienvenidos</h1><p>Escucho · Miro · Juego</p></header><section class="panel"><div class="top"><span id="step">Actividad 1</span><span id="count">1 / 12</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="content"></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="controls"><button class="action" id="listen">🔊 Escuchar</button><button class="action" id="repeat">🔁 Repetir</button><button class="action primary" id="next" disabled>➡️ Siguiente</button></div><div class="hint">👂 Escucha · 👆 Pulsa · ⭐ Comprueba</div></section><p class="muted">Actividad original de práctica. Inspirada en los contenidos de la Unidad 0 de «Lola y Leo 1». No reproduce sus ilustraciones ni sus audios.</p></main><script>
(()=>{'use strict';const steps=[
{type:'choose',title:'👋 ¡Hola!',speech:'Hola. Escucha y pulsa hola.',question:'👂 ¿Hola?',options:[['👋','¡Hola!'],['👋🌙','Buenas noches'],['👋🚪','Adiós']],correct:0},
{type:'choose',title:'👂 ¿Es español?',speech:'Escucha: bienvenidos. ¿Es español? Sí.',question:'🔊 «Bienvenidos»',options:[['👍','Sí'],['👎','No']],correct:0},
{type:'choose',title:'👂 ¿Es español?',speech:'Escucha: goodbye. ¿Es español? No.',question:'🔊 «Goodbye»',options:[['👍','Sí'],['👎','No']],correct:1},
{type:'choose',title:'👋 Saludos',speech:'Hola. Pulsa el saludo.',question:'👂 Hola',options:[['👋','Hola'],['😴','Dormir'],['🍎','Manzana']],correct:0},
{type:'choose',title:'🌍 Países',speech:'España. Pulsa la bandera de España.',question:'👂 España',options:[['🇲🇽','México'],['🇪🇸','España'],['🇫🇷','Francia']],correct:1},
{type:'choose',title:'🌍 Países',speech:'México. Pulsa la bandera de México.',question:'👂 México',options:[['🇪🇸','España'],['🇲🇽','México'],['🇬🇧','Reino Unido']],correct:1},
{type:'choose',title:'🌍 ¿Dónde?',speech:'Sevilla está en España. Pulsa España.',question:'👂 Sevilla',options:[['🇲🇽','México'],['🇪🇸','España']],correct:1},
{type:'choose',title:'🌍 ¿Dónde?',speech:'Puebla está en México. Pulsa México.',question:'👂 Puebla',options:[['🇪🇸','España'],['🇲🇽','México']],correct:1},
{type:'choose',title:'🔤 Letras',speech:'Jota. Pulsa la letra jota.',question:'👂 Jota',options:[['R','R'],['J','J'],['Z','Z']],correct:1,letters:true},
{type:'choose',title:'🔤 Letras',speech:'Eñe. Pulsa la letra eñe.',question:'👂 Eñe',options:[['N','N'],['H','H'],['Ñ','Ñ']],correct:2,letters:true},
{type:'choose',title:'🔤 Letras',speech:'Hache. Pulsa la letra hache.',question:'👂 Hache',options:[['H','H'],['CH','CH'],['J','J']],correct:0,letters:true},
{type:'choose',title:'👧🧒 Nombres',speech:'¿Cómo se llama? Se llama Lola. Pulsa Lola.',question:'👂 «Se llama Lola»',options:[['👧','Lola'],['👦','Leo'],['🐕','Perro']],correct:0}
];let pos=0,solved=false,misses=0;const el=id=>document.getElementById(id),c=el('content'),fb=el('feedback');function say(t){if(!('speechSynthesis'in window)){fb.textContent='🔇 Este navegador no tiene voz automática.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1;const voices=speechSynthesis.getVoices();const es=voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(es)u.voice=es;speechSynthesis.speak(u)}function node(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}function render(){solved=false;misses=0;fb.textContent='';el('next').disabled=true;const s=steps[pos];el('step').textContent='Actividad '+(pos+1);el('count').textContent=(pos+1)+' / '+steps.length;el('bar').style.width=(pos/steps.length*100)+'%';c.replaceChildren();c.append(node('h2','',s.title));c.append(node('p','instruction',s.question));const grid=node('div','grid');s.options.forEach(([icon,label],i)=>{const b=node('button','choice');b.type='button';b.setAttribute('aria-label',label);b.append(node('span',s.letters?'letter':'icon',icon));b.append(node('span','',label));b.addEventListener('click',()=>{if(solved)return;if(i===s.correct){solved=true;b.classList.add('correct');fb.textContent='⭐ ¡Muy bien!';say('¡Muy bien!');el('next').disabled=false;[...grid.children].forEach(x=>x.disabled=true)}else{misses++;b.classList.add('wrong');fb.textContent='🔁 Inténtalo otra vez';say('Prueba otra vez');setTimeout(()=>b.classList.remove('wrong'),650)}});grid.append(b)});c.append(grid)}function finish(){speechSynthesis.cancel();el('bar').style.width='100%';el('step').textContent='¡Terminado!';el('count').textContent='12 / 12';c.replaceChildren(node('div','big','🏆'),node('h2','','¡Lo has conseguido!'),node('p','end','⭐ ⭐ ⭐'));fb.textContent='';el('next').textContent='🔁 Volver a empezar';el('next').disabled=false;el('next').onclick=()=>{pos=0;el('next').textContent='➡️ Siguiente';el('next').onclick=advance;render()};el('listen').disabled=true;el('repeat').disabled=true;say('¡Muy bien! Has terminado la unidad cero.')}function advance(){if(pos<steps.length-1){pos++;render()}else finish()}el('next').onclick=advance;el('listen').onclick=()=>say(steps[pos].speech);el('repeat').onclick=()=>{speechSynthesis.cancel();render();say(steps[pos].speech)};render();if('speechSynthesis'in window)speechSynthesis.getVoices();})();
</script></body></html>
